name: Release Android APK

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  direct-apk:
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release Android v1.1.1'))
    name: Build and verify signed direct-install APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d1652
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96
        with:
          gradle-version: '8.13'

      - name: Verify source and release version
        run: |
          set -euo pipefail
          python3 scripts/verify_companion_design.py
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v1.1.1"
          fi
          VERSION="${TAG#v}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a version tag such as v1.1.1."
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          if (( MAJOR > 2000 || MINOR > 999 || PATCH > 999 )); then
            echo "::error::Version components are out of range."
            exit 1
          fi
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          if (( VERSION_CODE <= 0 || VERSION_CODE > 2100000000 )); then
            echo "::error::Generated Android versionCode is out of range."
            exit 1
          fi
          grep -F 'applicationId = "com.deadsmilegames.companion"' app/build.gradle.kts
          grep -F 'targetSdk = 36' app/build.gradle.kts
          printf 'APP_VERSION_NAME=%s\n' "$VERSION" >> "$GITHUB_ENV"
          printf 'APP_VERSION_CODE=%s\n' "$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Prepare and validate persistent release signing key
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_RELEASE_KEYSTORE_BASE64 ANDROID_RELEASE_STORE_PASSWORD ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name. Configure the persistent Android release keystore before publishing."
              exit 1
            fi
          done
          KEYSTORE="$RUNNER_TEMP/deadsmile-release.keystore"
          if ! printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE" || ! test -s "$KEYSTORE"; then
            echo "::error::ANDROID_RELEASE_KEYSTORE_BASE64 is not a valid base64-encoded keystore."
            exit 1
          fi
          chmod 600 "$KEYSTORE"
          if ! keytool -list -keystore "$KEYSTORE" -storepass "$ANDROID_RELEASE_STORE_PASSWORD" -alias "$ANDROID_RELEASE_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The release keystore, store password, or key alias is invalid."
            exit 1
          fi
          printf 'ANDROID_RELEASE_KEYSTORE_PATH=%s\n' "$KEYSTORE" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace testDirectDebugUnitTest testPlayDebugUnitTest

      - name: Build and verify direct-install APK
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleDirectRelease \
            -PappVersionName="$APP_VERSION_NAME" \
            -PappVersionCode="$APP_VERSION_CODE"

          APK="app/build/outputs/apk/direct/release/app-direct-release.apk"
          test -s "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose "$APK"
          SIGNING_REPORT="$("$APKSIGNER" verify --print-certs "$APK")"
          printf '%s\n' "$SIGNING_REPORT"
          CERT_FINGERPRINT="$(printf '%s\n' "$SIGNING_REPORT" | sed -n 's/.*certificate SHA-256 digest: *//p' | head -n 1 | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          if [[ ! "$CERT_FINGERPRINT" =~ ^[0-9A-F]{64}$ ]]; then
            echo "::error::Could not extract the APK signing certificate SHA-256 fingerprint."
            exit 1
          fi
          printf 'APK_SIGNING_CERT_SHA256=%s\n' "$CERT_FINGERPRINT" >> "$GITHUB_ENV"

          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='com.deadsmilegames.companion' versionCode='$APP_VERSION_CODE' versionName='$APP_VERSION_NAME'"
          printf '%s\n' "$BADGING" | grep -F "application-label:'Deadsmile Games'"
          printf '%s\n' "$BADGING" | grep -F "targetSdkVersion:'36'"
          printf '%s\n' "$("$AAPT" dump permissions "$APK")" | grep -F "android.permission.REQUEST_INSTALL_PACKAGES"

          cp "$APK" "$RUNNER_TEMP/Deadsmile-Games-Android-v$APP_VERSION_NAME.apk"
          sha256sum "$RUNNER_TEMP/Deadsmile-Games-Android-v$APP_VERSION_NAME.apk"
          printf 'APK_ASSET=%s\n' "$RUNNER_TEMP/Deadsmile-Games-Android-v$APP_VERSION_NAME.apk" >> "$GITHUB_ENV"

      - name: Publish APK release
        if: github.event_name != 'workflow_dispatch' && (github.ref_type == 'tag' || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release Android v1.1.1')))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v1.1.1"
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" \
            "$APK_ASSET#Deadsmile-Games-Android-v$APP_VERSION_NAME.apk" \
            --title "Deadsmile Games $APP_VERSION_NAME" \
            --notes "APK for direct installation on Android.

          Signed with the configured persistent Android release keystore, not a Google Play app-signing certificate. This is a direct-download APK, not a Google Play Store release.
          
          Signing certificate SHA-256: $APK_SIGNING_CERT_SHA256
          
          Android only permits an in-place update when the signing certificate matches. Older builds signed with a different certificate must be uninstalled before installing this release; uninstalling may erase local app data."
